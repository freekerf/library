id = "generic-diode-10w-grbl"
manufacturer = "Generic"
model = "Diode 10 W, 400 × 400 mm, Grbl 1.1"
origin = "front_left"
max_speed_mm_min = 10000
notes = "Reference profile for the common open-frame diode engravers. Adjust work area and steps/mm to your machine."

[work_area]
x_mm = 400
y_mm = 400

[firmware]
kind = "grbl"
min_version = "1.1f"

[features]
air_assist = true
rotary = false
camera = false
z_axis = false

[laser]
kind = "diode"
power_w = 10

[[settings]]
key = "$30"
value = "1000"
description = "Maximum spindle/laser S value; FreeKerf scales power 0–100 % into 0–1000."

[[settings]]
key = "$31"
value = "0"
description = "Minimum S value."

[[settings]]
key = "$32"
value = "1"
description = "Laser mode: power follows motion (M4 dynamic power), no stop on S changes."
