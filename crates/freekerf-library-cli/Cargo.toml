[package]
name = "freekerf-library-cli"
description = "Command line to validate, package and import the FreeKerf materials library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "freekerf-library"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
freekerf-library = { version = "0.1.0", path = "../freekerf-library" }
semver = "1.0.28"
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints]
workspace = true
